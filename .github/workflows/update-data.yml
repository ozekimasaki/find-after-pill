name: Update Pharmacy Data

on:
  schedule:
    # 毎日 UTC 21:00 (日本時間 6:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行も可能

concurrency:
  group: update-pharmacy-data
  cancel-in-progress: false

jobs:
  update:
    # Raspberry Pi 上の self-hosted runner のみで実行する
    runs-on: [self-hosted, linux, ARM64, pharmacy-data-update]
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and convert Excel data
        run: npm run fetch-data
        env:
          # ジオコーディングの全件処理を有効化
          GEOCODE_ALL: 'true'

      - name: Upload pharmacies data to KV
        run: |
          npx wrangler kv key put \
            --namespace-id=${{ secrets.KV_NAMESPACE_ID }} \
            --remote \
            pharmacies \
            --path=public/data/pharmacies.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload meta data to KV
        run: |
          npx wrangler kv key put \
            --namespace-id=${{ secrets.KV_NAMESPACE_ID }} \
            --remote \
            meta \
            --path=public/data/meta.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const meta = JSON.parse(fs.readFileSync('public/data/meta.json', 'utf8'));
          const summaryLines = [
            '## Data Update Summary',
            '',
            `- **Total pharmacies**: ${meta.totalCount}`,
            `- **Last updated**: ${meta.lastUpdated}`,
            `- **Source**: ${meta.sourceUrl}`,
            '',
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summaryLines.join('\n')}\n`);
          EOF
